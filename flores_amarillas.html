<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti 🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #080312;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay-container {
      position: absolute;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #photos-orbit-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* TAMAÑO ADAPTABLE DE FOTOS (MÓVIL PRIMERO) */
    .floating-photo {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 20px rgba(255, 140, 0, 0.6);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s linear;
      background: #111;
    }

    .floating-photo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .floating-photo span {
      position: absolute;
      bottom: -22px;
      white-space: nowrap;
      color: #ffeb3b;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 0 6px #ffa000, 0 0 4px #000;
    }

    /* TAMAÑO MAYOR PARA PANTALLAS MÁS GRANDES (COMPUTADORA/TABLET) */
    @media (min-width: 600px) {
      .floating-photo {
        width: 120px;
        height: 120px;
      }
      .floating-photo span {
        bottom: -28px;
        font-size: 13px;
      }
    }

    /* TARJETA DE MENSAJE */
    .card {
      pointer-events: auto;
      background: linear-gradient(145deg, #fffef0, #fff7c2);
      color: #333;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.8), 0 10px 25px rgba(0,0,0,0.5);
      border: 3px solid #ffd700;
      transform: scale(1);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .card.hidden {
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
    }
    .card h2 {
      color: #b8860b;
      font-size: 1.6rem;
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
    }
    .card p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
      margin-bottom: 10px;
    }
    .card .highlight {
      font-weight: bold;
      color: #d4a017;
      font-size: 1.1rem;
      margin-top: 8px;
      font-family: 'Georgia', serif;
    }
    .card button {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border: none;
      color: #fff;
      padding: 8px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
      transition: transform 0.2s;
    }
    .card button:hover {
      transform: scale(1.05);
    }
    .btn-reopen {
      position: absolute;
      bottom: 20px;
      z-index: 11;
      background: rgba(255, 215, 0, 0.25);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  
  <div id="photos-orbit-container"></div>

  <div class="overlay-container">
    <div class="card" id="letterCard">
      <h2>🌻 Mi reina 🌻</h2>
      <p>Estas flores amarillas son como tú: brillantes, radiantes y llenas de alegría.</p>
      <p>Gracias por iluminar cada uno de mis días. Eres simplemente hermosa.</p>
      <p class="highlight">Te Quiero Mucho</p>
      <button onclick="toggleCard(false)">Cerrar ✨</button>
    </div>
  </div>

  <button class="btn-reopen" onclick="toggleCard(true)">Ver Carta 💌</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // RADIOS BASE QUE SE ESCALAN SEGÚN LA PANTALLA
    const photoList = [
      { src: 'IMG-20250622-WA0056.jpg', label: '🌻 Eres mi sol', baseRadius: 180, angle: 0, speed: 0.005, position: 'center 15%' },
      { src: 'IMG-20250719-WA0089.jpg', label: '🌻 Mi Amor', baseRadius: 270, angle: 1.25, speed: 0.004, position: 'center top' },
      { src: 'IMG-20250820-WA0033.jpg', label: '🌻 Eres preciosa', baseRadius: 210, angle: 2.5, speed: 0.006, position: 'center 20%' },
      { src: 'IMG-20250510-WA0055.jpg', label: '🌻 Me encantas', baseRadius: 310, angle: 3.75, speed: 0.0038, position: 'center center' },
      { src: 'IMG-20250531-WA0119.jpg', label: '🌻 Mi cachetitos', baseRadius: 240, angle: 5.0, speed: 0.0052, position: 'center 15%' }
    ];

    const photoContainer = document.getElementById('photos-orbit-container');
    const photoElements = photoList.map(item => {
      const div = document.createElement('div');
      div.className = 'floating-photo';
      
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = 'Foto';
      img.style.objectPosition = item.position;
      
      const span = document.createElement('span');
      span.innerText = item.label;

      div.appendChild(img);
      div.appendChild(span);
      photoContainer.appendChild(div);

      return { element: div, data: item };
    });

    const numParticles = 200;
    const particles = [];
    for (let i = 0; i < numParticles; i++) {
      particles.push({
        radius: Math.random() * Math.min(width, height) * 0.5 + 20,
        angle: Math.random() * Math.PI * 2,
        speed: (0.001 + Math.random() * 0.0025) * (Math.random() > 0.5 ? 1 : -1),
        size: Math.random() * 2 + 0.5,
        opacity: Math.random() * 0.8 + 0.2
      });
    }

    const bgFlowers = [];
    const numBgFlowers = 18;
    for (let i = 0; i < numBgFlowers; i++) {
      bgFlowers.push({
        type: Math.random() > 0.4 ? 'tulip' : 'sunflower',
        baseRadius: 100 + Math.random() * 220,
        angle: Math.random() * Math.PI * 2,
        speed: (0.002 + Math.random() * 0.003) * (Math.random() > 0.5 ? 1 : -1),
        size: 14 + Math.random() * 14,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.015
      });
    }

    function drawSunflower(x, y, size, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      const numPetals = 12;
      ctx.fillStyle = '#FFD700';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#FFA500';

      for (let i = 0; i < numPetals; i++) {
        ctx.beginPath();
        ctx.rotate((Math.PI * 2) / numPetals);
        ctx.ellipse(size * 0.55, 0, size * 0.45, size * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#5C3A21';
      ctx.shadowBlur = 4;
      ctx.shadowColor = '#000';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = '#3D2314';
      ctx.fill();

      ctx.restore();
    }

    function drawTulip(x, y, size, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      ctx.strokeStyle = '#4CAF50';
      ctx.lineWidth = size * 0.12;
      ctx.beginPath();
      ctx.moveTo(0, size * 0.2);
      ctx.quadraticCurveTo(-size * 0.1, size * 0.6, 0, size * 0.9);
      ctx.stroke();

      ctx.shadowBlur = 8;
      ctx.shadowColor = '#FFD700';

      ctx.fillStyle = '#FFC107';
      ctx.beginPath();
      ctx.ellipse(0, -size * 0.2, size * 0.28, size * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.ellipse(-size * 0.2, -size * 0.1, size * 0.25, size * 0.42, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFE082';
      ctx.beginPath();
      ctx.ellipse(size * 0.2, -size * 0.1, size * 0.25, size * 0.42, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    let globalRotation = 0;

    function animate() {
      ctx.clearRect(0, 0, width, height);
      const cx = width / 2;
      const cy = height / 2;
      globalRotation += 0.005;

      // ESCALA DINÁMICA DE ÓRBITAS PARA CELULARES
      const isMobile = width < 600;
      const scaleFactor = isMobile ? (width * 0.42) / 280 : 1;

      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(width, height) * 0.5);
      grad.addColorStop(0, 'rgba(255, 215, 0, 0.2)');
      grad.addColorStop(0.5, 'rgba(255, 140, 0, 0.06)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.angle += p.speed;
        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * p.radius * 0.5;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 223, 100, ${p.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffd700';
        ctx.fill();
      });

      bgFlowers.forEach(f => {
        f.angle += f.speed;
        f.rotation += f.rotSpeed;
        const currentR = f.baseRadius * scaleFactor;
        const x = cx + Math.cos(f.angle) * currentR;
        const y = cy + Math.sin(f.angle) * currentR * 0.55;

        if (f.type === 'sunflower') {
          drawSunflower(x, y, f.size, f.rotation);
        } else {
          drawTulip(x, y, f.size, f.rotation);
        }
      });

      drawSunflower(cx, cy - 10, isMobile ? 32 : 48, globalRotation);

      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font = isMobile ? 'bold 14px sans-serif' : 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffd700';
      ctx.fillText('Te quiero', cx, cy + (isMobile ? 40 : 50));
      ctx.restore();

      photoElements.forEach(item => {
        item.data.angle += item.data.speed;
        const currentR = item.data.baseRadius * scaleFactor;
        const x = cx + Math.cos(item.data.angle) * currentR;
        const y = cy + Math.sin(item.data.angle) * currentR * (isMobile ? 0.6 : 0.5);

        item.element.style.left = `${x}px`;
        item.element.style.top = `${y}px`;
      });

      requestAnimationFrame(animate);
    }

    animate();

    function toggleCard(show) {
      const card = document.getElementById('letterCard');
      if (show) card.classList.remove('hidden');
      else card.classList.add('hidden');
    }
  </script>
</body>
</html>
